release_package_job:
  stage: release
  
  before_script:
    - apt-get update && apt-get install -y curl
    - curl -L --output release-cli "https://release-cli-downloads.s3.amazonaws.com/latest/release-cli-linux-amd64"
    - chmod +x release-cli
    - mv -f release-cli /usr/local/bin/

  script:
    - echo $CI_JOB_NAME-$CI_JOB_ID
    - echo "Preparing ULaMDyn release..."
    - ls dist/
    
    # Ensure a valid tag name is available
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        export TAG_NAME="$CI_COMMIT_TAG"
      fi

    - echo "Current TAG_NAME = $TAG_NAME"
    - export EXPECTED_WHEEL_NAME="ulamdyn-$TAG_NAME-py3-none-any.whl"
    - echo "Expected wheel file = $EXPECTED_WHEEL_NAME"  

  release:
    name: "ULaMDyn package v$TAG_NAME"
    description: "Automatic release of the package"
    tag_name: "$TAG_NAME"
    ref: "$CI_COMMIT_SHA"
    assets:
      links:
        - name: "Wheel file"
          # Important: the CI_JOB_ID must be the one of build step, GE_JOB_ID
          url: "https://gitlab.com/${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}/-/jobs/${GE_JOB_ID}/artifacts/file/dist/ulamdyn-${TAG_NAME}-py3-none-any.whl"
  
  # Run only on master or when a tag is created
  only:
    refs:
      - master
    
  # Update version only if build job has been completed successfully
  needs: 
    - job: build_wheel_job
      artifacts: true
    - job: version_bump_job
      artifacts: true  
